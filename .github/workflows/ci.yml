name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test (server, core, protocol, networking)
        run: dotnet test -c Release
      - name: Build Godot client scripts
        run: dotnet build client/IH.Client.csproj -c Release
      - name: Publish server for Windows
        run: dotnet publish src/IH.Server -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o dist/server-win-x64
      - name: Publish server for Linux
        run: dotnet publish src/IH.Server -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o dist/server-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: server-win-x64
          path: dist/server-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          path: dist/server-linux-x64
